services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vayra
      POSTGRES_USER: vayra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - vayra_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vayra -d vayra"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://vayra:${POSTGRES_PASSWORD}@postgres:5432/vayra?sslmode=disable
      LISTEN_ADDR: 0.0.0.0:8080
      HTTP_READ_TIMEOUT: 10s
      HTTP_WRITE_TIMEOUT: 15s
      HTTP_IDLE_TIMEOUT: 60s
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  vayra_postgres:
  caddy_data:
  caddy_config:
